<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c7e4fb"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e8fe0"/>
      <stop offset="1" stop-color="#0b3f78"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0b3f78" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="375" r="310" fill="#fff" opacity=".5"/>
  <!-- freelancer: one person -->
  <g filter="url(#sh)">
    <rect x="130" y="230" width="260" height="320" rx="30" fill="#fff"/>
  </g>
  <circle cx="260" cy="330" r="40" fill="#0b1220" fill-opacity=".75"/>
  <path d="M190 440c12-38 40-58 70-58s58 20 70 58" fill="#0b1220" fill-opacity=".75"/>
  <rect x="180" y="480" width="160" height="14" rx="7" fill="#0b1220" fill-opacity=".2"/>
  <!-- team: highlighted -->
  <g filter="url(#sh)">
    <rect x="460" y="180" width="280" height="420" rx="34" fill="url(#a)"/>
  </g>
  <circle cx="540" cy="310" r="30" fill="#fff" fill-opacity=".55"/>
  <circle cx="660" cy="310" r="30" fill="#fff" fill-opacity=".55"/>
  <circle cx="600" cy="290" r="38" fill="#fff"/>
  <path d="M528 420c12-40 40-62 72-62s60 22 72 62" fill="#fff"/>
  <rect x="520" y="470" width="160" height="16" rx="8" fill="#fff" fill-opacity=".85"/>
  <rect x="545" y="502" width="110" height="12" rx="6" fill="#fff" fill-opacity=".45"/>
  <!-- offshore: globe -->
  <g filter="url(#sh)">
    <rect x="810" y="230" width="260" height="320" rx="30" fill="#fff"/>
  </g>
  <g stroke="#0b1220" stroke-opacity=".75" stroke-width="6">
    <circle cx="940" cy="360" r="62"/>
    <ellipse cx="940" cy="360" rx="26" ry="62"/>
    <path d="M878 360h124M886 330h108M886 390h108"/>
  </g>
  <rect x="860" y="480" width="160" height="14" rx="7" fill="#0b1220" fill-opacity=".2"/>
</svg>
