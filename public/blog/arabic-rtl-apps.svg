<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c7e4fb"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e8fe0"/>
      <stop offset="1" stop-color="#0b3f78"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0b3f78" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="375" r="290" fill="#fff" opacity=".5"/>
  <!-- left-to-right phone -->
  <g filter="url(#sh)">
    <rect x="250" y="130" width="250" height="490" rx="44" fill="#0b1220"/>
    <rect x="700" y="130" width="250" height="490" rx="44" fill="#0b1220"/>
  </g>
  <rect x="264" y="144" width="222" height="462" rx="34" fill="#fff"/>
  <rect x="714" y="144" width="222" height="462" rx="34" fill="url(#a)"/>
  <!-- LTR content: aligned left, back arrow on the left -->
  <path d="M300 200l-14 14 14 14" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="250" width="150" height="16" rx="8" fill="#0b1220"/>
  <rect x="290" y="280" width="110" height="12" rx="6" fill="#0b1220" fill-opacity=".25"/>
  <rect x="290" y="320" width="170" height="90" rx="18" fill="#dcf0ff"/>
  <rect x="290" y="430" width="160" height="12" rx="6" fill="#0b1220" fill-opacity=".25"/>
  <rect x="290" y="454" width="120" height="12" rx="6" fill="#0b1220" fill-opacity=".25"/>
  <rect x="290" y="530" width="170" height="44" rx="22" fill="#0b1220"/>
  <!-- RTL content: mirrored, aligned right, back arrow on the right -->
  <path d="M900 200l14 14-14 14" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="760" y="250" width="150" height="16" rx="8" fill="#fff"/>
  <rect x="800" y="280" width="110" height="12" rx="6" fill="#fff" fill-opacity=".45"/>
  <rect x="740" y="320" width="170" height="90" rx="18" fill="#fff" fill-opacity=".2"/>
  <rect x="750" y="430" width="160" height="12" rx="6" fill="#fff" fill-opacity=".45"/>
  <rect x="790" y="454" width="120" height="12" rx="6" fill="#fff" fill-opacity=".45"/>
  <rect x="740" y="530" width="170" height="44" rx="22" fill="#fff"/>
  <!-- direction arrows -->
  <path d="M545 335h110M615 305l40 30-40 30" stroke="#0b1220" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M655 425H545M585 395l-40 30 40 30" stroke="#1e8fe0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
