<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c7e4fb"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e8fe0"/>
      <stop offset="1" stop-color="#0b3f78"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1c2b45"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0b3f78" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="375" r="290" fill="#fff" opacity=".5"/>
  <!-- two framework "sources" (abstract shapes, no logos) -->
  <g filter="url(#sh)">
    <rect x="180" y="200" width="200" height="140" rx="28" fill="#fff"/>
    <rect x="180" y="410" width="200" height="140" rx="28" fill="#fff"/>
  </g>
  <path d="M240 300l40-60 40 60z" fill="#1e8fe0"/>
  <circle cx="280" cy="480" r="38" stroke="#0b1220" stroke-width="10"/>
  <circle cx="280" cy="480" r="10" fill="#0b1220"/>
  <!-- connectors into one codebase -->
  <path d="M380 270C470 270 470 375 560 375M380 480C470 480 470 375 560 375" stroke="#1e8fe0" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <g filter="url(#sh)">
    <circle cx="600" cy="375" r="56" fill="#fff"/>
  </g>
  <path d="M583 352l-22 23 22 23M617 352l22 23-22 23" stroke="#0b1220" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M656 375C730 375 730 250 800 250M656 375C730 375 730 500 800 500" stroke="#1e8fe0" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <!-- two phones -->
  <g filter="url(#sh)">
    <rect x="800" y="150" width="150" height="250" rx="30" fill="#0b1220"/>
    <rect x="800" y="380" width="150" height="250" rx="30" fill="#0b1220"/>
  </g>
  <rect x="810" y="160" width="130" height="230" rx="22" fill="url(#a)"/>
  <rect x="810" y="390" width="130" height="230" rx="22" fill="url(#b)"/>
  <rect x="830" y="200" width="90" height="12" rx="6" fill="#fff" fill-opacity=".85"/>
  <rect x="830" y="224" width="60" height="10" rx="5" fill="#fff" fill-opacity=".45"/>
  <rect x="830" y="300" width="90" height="60" rx="14" fill="#fff" fill-opacity=".2"/>
  <rect x="830" y="430" width="90" height="12" rx="6" fill="#fff" fill-opacity=".85"/>
  <rect x="830" y="454" width="60" height="10" rx="5" fill="#fff" fill-opacity=".45"/>
  <rect x="830" y="530" width="90" height="60" rx="14" fill="#1e8fe0" fill-opacity=".5"/>
</svg>
