<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c7e4fb"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1c2b45"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e8fe0"/>
      <stop offset="1" stop-color="#0b3f78"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0b3f78" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="470" cy="375" r="280" fill="#fff" opacity=".5"/>
  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="340" y="120" width="270" height="520" rx="46" fill="#0b1220"/>
  </g>
  <rect x="354" y="134" width="242" height="492" rx="36" fill="url(#scr)"/>
  <rect x="435" y="150" width="80" height="20" rx="10" fill="#0b1220"/>
  <!-- shield -->
  <path d="M475 230l90 34v70c0 66-40 112-90 132-50-20-90-66-90-132v-70z" fill="url(#shield)"/>
  <path d="M438 350l26 26 48-54" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="390" y="510" width="170" height="14" rx="7" fill="#fff" fill-opacity=".8"/>
  <rect x="410" y="538" width="130" height="10" rx="5" fill="#fff" fill-opacity=".4"/>
  <!-- checklist card -->
  <g filter="url(#sh)">
    <rect x="680" y="190" width="360" height="380" rx="30" fill="#fff"/>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="716" y="236" width="34" height="34" rx="10" fill="#1e8fe0"/>
    <path d="M725 253l7 7 12-14" stroke="#fff" stroke-width="5"/>
    <rect x="716" y="306" width="34" height="34" rx="10" fill="#1e8fe0"/>
    <path d="M725 323l7 7 12-14" stroke="#fff" stroke-width="5"/>
    <rect x="716" y="376" width="34" height="34" rx="10" fill="#1e8fe0"/>
    <path d="M725 393l7 7 12-14" stroke="#fff" stroke-width="5"/>
    <rect x="716" y="446" width="34" height="34" rx="10" stroke="#0b1220" stroke-opacity=".25" stroke-width="4"/>
    <rect x="716" y="516" width="34" height="34" rx="10" stroke="#0b1220" stroke-opacity=".25" stroke-width="4"/>
  </g>
  <g fill="#0b1220">
    <rect x="770" y="246" width="200" height="14" rx="7" fill-opacity=".75"/>
    <rect x="770" y="316" width="170" height="14" rx="7" fill-opacity=".75"/>
    <rect x="770" y="386" width="220" height="14" rx="7" fill-opacity=".75"/>
    <rect x="770" y="456" width="180" height="14" rx="7" fill-opacity=".2"/>
    <rect x="770" y="526" width="150" height="14" rx="7" fill-opacity=".2"/>
  </g>
</svg>
