<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c7e4fb"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e8fe0"/>
      <stop offset="1" stop-color="#0b3f78"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0b3f78" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="900" cy="375" r="260" fill="#fff" opacity=".5"/>
  <!-- timeline -->
  <path d="M120 470H760" stroke="#0b1220" stroke-opacity=".15" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 470H640" stroke="#1e8fe0" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b1220" fill-opacity=".55" text-anchor="middle">
    <circle cx="140" cy="470" r="16" fill="#1e8fe0"/><text x="140" y="525">WK 1</text>
    <circle cx="260" cy="470" r="16" fill="#1e8fe0"/><text x="260" y="525">WK 3</text>
    <circle cx="380" cy="470" r="16" fill="#1e8fe0"/><text x="380" y="525">WK 6</text>
    <circle cx="500" cy="470" r="16" fill="#1e8fe0"/><text x="500" y="525">WK 10</text>
    <circle cx="620" cy="470" r="16" fill="#1e8fe0"/><text x="620" y="525">WK 14</text>
    <circle cx="740" cy="470" r="18" fill="#fff" stroke="#1e8fe0" stroke-width="6"/><text x="740" y="525">LAUNCH</text>
  </g>
  <!-- milestone cards -->
  <g filter="url(#sh)">
    <rect x="150" y="250" width="200" height="120" rx="22" fill="#fff"/>
    <rect x="390" y="210" width="200" height="160" rx="22" fill="#fff"/>
  </g>
  <rect x="176" y="280" width="90" height="14" rx="7" fill="#1e8fe0"/>
  <rect x="176" y="312" width="148" height="10" rx="5" fill="#0b1220" fill-opacity=".12"/>
  <rect x="176" y="334" width="120" height="10" rx="5" fill="#0b1220" fill-opacity=".12"/>
  <rect x="416" y="240" width="100" height="14" rx="7" fill="#0b1220"/>
  <rect x="416" y="272" width="148" height="10" rx="5" fill="#0b1220" fill-opacity=".12"/>
  <rect x="416" y="294" width="130" height="10" rx="5" fill="#0b1220" fill-opacity=".12"/>
  <rect x="416" y="326" width="70" height="24" rx="12" fill="#dcf0ff"/>
  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="820" y="140" width="250" height="480" rx="44" fill="#0b1220"/>
    <rect x="834" y="154" width="222" height="452" rx="34" fill="url(#scr)"/>
  </g>
  <rect x="905" y="170" width="80" height="20" rx="10" fill="#0b1220"/>
  <circle cx="945" cy="350" r="62" fill="#fff" fill-opacity=".16"/>
  <path d="M915 350l22 22 42-46" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="870" y="450" width="150" height="14" rx="7" fill="#fff" fill-opacity=".85"/>
  <rect x="890" y="478" width="110" height="10" rx="5" fill="#fff" fill-opacity=".45"/>
  <rect x="870" y="530" width="150" height="40" rx="20" fill="#fff"/>
</svg>
