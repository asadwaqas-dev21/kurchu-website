<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 260) scale(480)">
      <stop stop-color="#1e8fe0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1e8fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5fb4f0"/>
      <stop offset="1" stop-color="#1e8fe0" stop-opacity=".25"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- map roads -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="18" stroke-linecap="round">
    <path d="M-40 520C200 470 360 600 620 540s420-160 640-110"/>
    <path d="M180-40c40 200-60 360 30 520s40 260 0 320"/>
    <path d="M900-40c-60 180 80 300 20 460s-120 220-60 360"/>
  </g>
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
    <path d="M0 120h1200M0 260h1200M0 400h1200M0 640h1200M320 0v750M560 0v750M760 0v750M1040 0v750"/>
  </g>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <!-- ranking bars -->
  <rect x="300" y="470" width="90" height="150" rx="14" fill="url(#bar)"/>
  <rect x="420" y="410" width="90" height="210" rx="14" fill="url(#bar)"/>
  <rect x="690" y="350" width="90" height="270" rx="14" fill="url(#bar)"/>
  <rect x="810" y="280" width="90" height="340" rx="14" fill="url(#bar)"/>
  <path d="M300 440l120-60 150-80 120 30 150-110" stroke="#7cc4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 14"/>
  <!-- pin -->
  <g filter="url(#sh)">
    <path d="M600 120c-78 0-140 60-140 136 0 104 140 244 140 244s140-140 140-244c0-76-62-136-140-136Z" fill="#1e8fe0"/>
    <circle cx="600" cy="254" r="58" fill="#fff"/>
    <path d="M600 222l10 22 24 3-18 16 5 24-21-12-21 12 5-24-18-16 24-3z" fill="#ffc94d"/>
  </g>
  <ellipse cx="600" cy="560" rx="70" ry="14" fill="#000" opacity=".35"/>
  <!-- rank chip -->
  <g filter="url(#sh)">
    <rect x="820" y="150" width="230" height="64" rx="32" fill="#fff"/>
    <circle cx="856" cy="182" r="20" fill="#1e8fe0"/>
    <text x="856" y="190" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <rect x="890" y="166" width="132" height="12" rx="6" fill="#0b1220"/>
    <rect x="890" y="188" width="96" height="10" rx="5" fill="#c9d6e6"/>
  </g>
  <g filter="url(#sh)">
    <rect x="150" y="190" width="210" height="96" rx="20" fill="#fff"/>
    <g fill="#ffc94d">
      <path d="M182 216l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z"/>
      <path d="M222 216l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z"/>
      <path d="M262 216l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z"/>
      <path d="M302 216l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z"/>
    </g>
    <rect x="172" y="262" width="150" height="10" rx="5" fill="#c9d6e6"/>
  </g>
</svg>
