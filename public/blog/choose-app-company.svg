<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c7e4fb"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e8fe0"/>
      <stop offset="1" stop-color="#0b3f78"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0b3f78" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="560" cy="375" r="290" fill="#fff" opacity=".5"/>
  <!-- clipboard -->
  <g filter="url(#sh)">
    <rect x="300" y="150" width="340" height="460" rx="32" fill="#fff"/>
  </g>
  <rect x="410" y="128" width="120" height="48" rx="16" fill="#0b1220"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="352" cy="252" r="18" fill="#1e8fe0"/>
    <path d="M343 252l6 6 11-12" stroke="#fff" stroke-width="5"/>
    <circle cx="352" cy="332" r="18" fill="#1e8fe0"/>
    <path d="M343 332l6 6 11-12" stroke="#fff" stroke-width="5"/>
    <circle cx="352" cy="412" r="18" fill="#1e8fe0"/>
    <path d="M343 412l6 6 11-12" stroke="#fff" stroke-width="5"/>
    <circle cx="352" cy="492" r="18" stroke="#0b1220" stroke-opacity=".25" stroke-width="4"/>
  </g>
  <g fill="#0b1220">
    <rect x="390" y="244" width="200" height="16" rx="8" fill-opacity=".75"/>
    <rect x="390" y="324" width="170" height="16" rx="8" fill-opacity=".75"/>
    <rect x="390" y="404" width="210" height="16" rx="8" fill-opacity=".75"/>
    <rect x="390" y="484" width="150" height="16" rx="8" fill-opacity=".2"/>
  </g>
  <!-- phone being reviewed -->
  <g filter="url(#sh)">
    <rect x="720" y="190" width="210" height="400" rx="38" fill="#0b1220"/>
  </g>
  <rect x="732" y="202" width="186" height="376" rx="28" fill="url(#a)"/>
  <rect x="756" y="250" width="120" height="14" rx="7" fill="#fff" fill-opacity=".85"/>
  <rect x="756" y="276" width="90" height="10" rx="5" fill="#fff" fill-opacity=".45"/>
  <rect x="756" y="320" width="138" height="110" rx="18" fill="#fff" fill-opacity=".18"/>
  <rect x="756" y="500" width="138" height="40" rx="20" fill="#fff"/>
  <!-- magnifier -->
  <circle cx="900" cy="470" r="70" stroke="#0b1220" stroke-width="16" fill="#fff" fill-opacity=".35"/>
  <path d="M950 520l60 60" stroke="#0b1220" stroke-width="20" stroke-linecap="round"/>
</svg>
